<!DOCTYPE html>
<html lang="en">
<head>
    <title>User Login | ROVEXA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #050814; color: #fff; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .box { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(15px); border: 1px solid #1a253f; padding: 40px; border-radius: 15px; width: 380px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .form-control { background: #000; border: 1px solid #1a253f; color: #fff; padding: 12px; }
        .form-control:focus { border-color: #00ff88; box-shadow: none; background: #000; color: #fff; }
        .btn-pro { background: linear-gradient(45deg, #00ff88, #00f2fe); border: none; color: #000; font-weight: 800; }
    </style>
</head>
<body>
    <div class="box text-center">
        <h3 class="mb-4 fw-bold" style="color: #00f2fe;">ROVEXA LOGIN</h3>
        {% if error %}<div class="alert alert-danger small">{{ error }}</div>{% endif %}
        <form method="POST">
            <input type="text" name="phone" class="form-control mb-3" placeholder="Phone Number" required>
            <input type="password" name="password" class="form-control mb-4" placeholder="Password" required>
            <button type="submit" class="btn btn-pro w-100 py-2">LOGIN NOW</button>
        </form>
        <div class="mt-3 small">Don't have an account? <a href="/register" style="color: #00ff88;">Register</a></div>
    </div>
</body>
</html>
