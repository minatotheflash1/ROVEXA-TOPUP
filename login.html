<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login | ROVEXA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #050814; color: #fff; height: 100vh; display: flex; align-items: center; justify-content: center;}
        .box { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(15px); border: 1px solid rgba(0,242,254,0.2); padding: 40px; border-radius: 20px; width: 400px; }
        .form-control { background: #000; border: 1px solid #1a253f; color: #fff; padding: 12px; margin-bottom: 15px;}
        .form-control:focus { border-color: #00f2fe; box-shadow: none; background: #000; color: #fff; }
    </style>
</head>
<body>
    <div class="box text-center shadow-lg">
        <h3 class="mb-4 fw-bold" style="color: #00f2fe;">SECURE LOGIN</h3>
        {% if error %}<div class="alert alert-danger small">{{ error }}</div>{% endif %}
        <form method="POST">
            <input type="email" name="email" class="form-control" placeholder="Registered Email" required>
            <input type="password" name="password" class="form-control mb-4" placeholder="Password" required>
            <button type="submit" class="btn w-100 py-2 fw-bold" style="background: linear-gradient(45deg, #00ff88, #00f2fe); color: #000;">LOGIN</button>
        </form>
        <div class="mt-3 small">New to Rovexa? <a href="/register" style="color: #00ff88;">Create Account</a></div>
    </div>
</body>
</html>
